name: aniwings
description: "AniWings Desktop media application."
publish_to: 'none'

version: 1.2.5+12

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  video_player: ^2.14.0
  video_player_media_kit: ^2.0.0
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.2.1
  # This local package registers its native engine on Windows/Linux only.
  libtorrent_flutter:
    path: third_party/libtorrent_flutter
  # Compatible with this Flutter SDK's Android preview build.
  video_player_android: 2.12.2
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  intl: ^0.20.2
  html: ^0.15.7
  xml: ^7.0.1
  path_provider: ^2.1.5
  file_picker: ^13.1.0
  http: ^1.6.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  webview_flutter: ^4.13.0
  webview_flutter_windows: ^1.3.0
  url_launcher: ^6.3.2
  cryptography: ^2.9.0
  cloud_firestore: ^6.10.0
  app_links: ^7.2.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0
  fake_cloud_firestore: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/avatars/
    - assets/videos/
