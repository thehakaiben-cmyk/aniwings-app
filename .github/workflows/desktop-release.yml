name: Build & Release Desktop (Windows & Linux)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target GitHub Release tag (e.g. desktop-v1.2.5)'
        required: true
        default: 'desktop-v1.2.5'
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows Executables & Bundle
        run: powershell -ExecutionPolicy Bypass -File .\tool\build-release.ps1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            desktop/release/aniwings-desktop-windows-v*.exe
            desktop/release/aniwings-desktop-windows-v*.zip

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            file \
            wget \
            curl

      - name: Install appimagetool (FUSE-independent)
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && /tmp/appimagetool.AppImage --appimage-extract
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          rm -f /tmp/appimagetool.AppImage

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Linux AppImage
        run: |
          chmod +x ./tool/build-release.sh
          ./tool/build-release.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: desktop/release/aniwings-desktop-linux-v*.AppImage

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-artifacts

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-artifacts

      - name: List Release Files
        run: ls -la release-artifacts/

      - name: Publish or Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-artifacts/aniwings-desktop-windows-v*.exe
            release-artifacts/aniwings-desktop-windows-v*.zip
            release-artifacts/aniwings-desktop-linux-v*.AppImage
          generate_release_notes: true
